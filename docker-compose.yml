
# ─────────────────────────────────────────────────────────────────────────────
# Project: News Interest Platform
# Replaces: Kubernetes (Flink Operator, Strimzi Kafka, k8s services)
# ─────────────────────────────────────────────────────────────────────────────


networks:
  platform-net:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
  postgres-data:
  flink-checkpoints:

services:

  # ───────────────────────────────────────────────────────────────────────────
  # ZOOKEEPER (Kafka dependency)
  # ───────────────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - platform-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA (single broker, replaces 3-broker Strimzi cluster)
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks:
      - platform-net
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # KAFKA TOPIC INITIALIZER
  # Creates required topics: user-events, output-signal, output-group-signals
  # ───────────────────────────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks:
      - platform-net
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/init-kafka-topics.sh:/init-kafka-topics.sh
    entrypoint: ["/bin/bash", "/init-kafka-topics.sh"]
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: "9092"
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────────
  # MONGODB (Configured as Replica Set for CDC)
  # ───────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    networks:
      - platform-net
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: flinkdb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init-replica:
    image: mongo:7
    container_name: mongo-init-replica
    networks:
      - platform-net
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      bash -c "sleep 5 && mongosh --host mongodb -u admin -p password --authenticationDatabase admin --eval \"rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'mongodb:27017' } ] })\" || true"
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────────
  # DEBEZIUM KAFKA CONNECT (CDC)
  # ───────────────────────────────────────────────────────────────────────────
  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: debezium
    networks:
      - platform-net
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────────────
  # REDIS
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - platform-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # POSTGRES (State store for LangGraph financial-agent)
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    networks:
      - platform-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: langgraph
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langgraph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # EVENT SERVER (Node.js API + Socket.IO)
  # ───────────────────────────────────────────────────────────────────────────
  event-server:
    build:
      context: ./event-server
      dockerfile: Dockerfile
    container_name: event-server
    networks:
      - platform-net
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      MONGODB_URI: "mongodb://admin:password@mongodb:27017/flinkdb?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # CHAT SERVER (Dedicated WebSocket Microservice)
  # ───────────────────────────────────────────────────────────────────────────
  chat-server:
    build:
      context: ./chat-server
      dockerfile: Dockerfile
    container_name: chat-server
    networks:
      - platform-net
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGODB_URI: "mongodb://admin:password@mongodb:27017/flinkdb?authSource=admin"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # FINANCIAL AGENT (FastAPI AI Microservice)
  # ───────────────────────────────────────────────────────────────────────────
  financial-agent:
    build:
      context: ./financial-agent
      dockerfile: Dockerfile
    container_name: financial-agent
    networks:
      - platform-net
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - S3_BUCKET_NAME=agent-drift-telemetry
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ───────────────────────────────────────────────────────────────────────────
  # DRIFT DASHBOARD (Streamlit Showcase)
  # ───────────────────────────────────────────────────────────────────────────
  drift-dashboard:
    build:
      context: ./drift-dashboard
      dockerfile: Dockerfile
    container_name: drift-dashboard
    networks:
      - platform-net
    ports:
      - "8501:8501"
    restart: unless-stopped

