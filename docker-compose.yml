  # ───────────────────────────────────────────────────────────────────────────
  # FLINK SIMILAR-GROUPING — JobManager
  # Separate Flink cluster for similarity + grouping jobs
  # ───────────────────────────────────────────────────────────────────────────
  flink-sg-jobmanager:
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    container_name: flink-sg-jobmanager
    networks:
      - platform-net
    ports:
      - "8082:8081"   # Flink Web UI for similar-grouping cluster
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-sg-jobmanager
        jobmanager.memory.process.size: 1024m
        rest.address: 0.0.0.0
        rest.port: 8081
        akka.framesize: 2147483647b
        pekko.framesize: 2147483647b
        rest.client.max-content-length: 2147483647
        rest.server.max-content-length: 2147483647
        akka.ask.timeout: 120s
        pekko.ask.timeout: 120s
        python.executable: /usr/bin/python3
    volumes:
      - flink-checkpoints:/tmp/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # FLINK SIMILAR-GROUPING — TaskManager
  # ───────────────────────────────────────────────────────────────────────────
  flink-sg-taskmanager:
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    container_name: flink-sg-taskmanager
    networks:
      - platform-net
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-sg-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        akka.framesize: 2147483647b
        pekko.framesize: 2147483647b
        rest.client.max-content-length: 2147483647
        rest.server.max-content-length: 2147483647
        akka.ask.timeout: 120s
        pekko.ask.timeout: 120s
        python.executable: /usr/bin/python3
    volumes:
      - flink-checkpoints:/tmp/checkpoints
    depends_on:
      flink-sg-jobmanager:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # FLINK JOB SUBMITTER — Jaccard Similarity (pair matching)
  # ───────────────────────────────────────────────────────────────────────────
  flink-similarity:
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    container_name: flink-similarity
    networks:
      - platform-net
    command: >
      bash -c "
        echo 'Waiting for sg-JobManager...';
        until curl -sf http://flink-sg-jobmanager:8081/overview > /dev/null; do
          sleep 5;
        done;
        sleep 3;
        echo 'Submitting similarity job...';
        /opt/flink/bin/flink run --detached --jobmanager flink-sg-jobmanager:8081 -py /opt/flink/usrlib/src/similarity/jaccard_lsh_job.py;
        echo 'Similarity job submitted!';
      "
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-sg-jobmanager
        akka.framesize: 2147483647b
        pekko.framesize: 2147483647b
        rest.client.max-content-length: 2147483647
        rest.server.max-content-length: 2147483647
        akka.ask.timeout: 120s
        pekko.ask.timeout: 120s
        python.executable: /usr/bin/python3
    depends_on:
      flink-sg-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

